[workspace]
resolver = "2"
members = [
    "crates/soroban-scan-core",
    "crates/soroban-scan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["AyinkxLab <olayinkaawal00@gmail.com>"]
repository = "https://github.com/AyinkxLab/soroban-security-scanner"
homepage = "https://github.com/AyinkxLab/soroban-security-scanner"
description = "Deterministic security analysis for Stellar Soroban smart contracts and Rust projects."
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Rust source parsing (deterministic, no code execution)
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Filesystem traversal
walkdir = "2"

# Path matching for excludes
globset = "0.4"

# Fingerprints / hashing for baselines
sha2 = "0.10"
hex = "0.4"

# Internal crates
soroban-scan-core = { path = "crates/soroban-scan-core", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
